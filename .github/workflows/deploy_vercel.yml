name: Godot CI/CD to Vercel

on:
  push:
    branches:
      - main

jobs:
  export_and_deploy:
    name: Export to Web and Deploy to Vercel
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Create Web Build Folder
        run: mkdir -p build/web

      - name: Setup Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Export Web Build
        run: |
          godot --headless --export-release "Web" build/web/game.html

      - name: Copy Wrapper & Vercel Config
        run: |
          cp -r web_wrapper/* build/web/
          
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./build/web
          vercel-args: '--prod'
