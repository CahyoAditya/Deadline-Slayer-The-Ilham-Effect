name: Godot CI/CD to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  export_and_deploy:
    name: Export to Web and Deploy to Vercel
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Create Web Build Folder
        run: mkdir -p build/web

      - name: Setup Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Export Web Build
        run: |
          godot --headless --export-release "Web" build/web/game.html

      - name: Copy Wrapper & Vercel Config
        run: |
          cp -r web_wrapper/* build/web/
          
      - name: Fix Git Dubious Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
      - name: Install Node.js (Required for Vercel CLI)
        run: |
          apt-get update && apt-get install -y nodejs npm
          
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./build/web
          vercel-args: '--prod'

  export_windows:
    name: Export Windows Desktop
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Create Windows Build Folder
        run: mkdir -p build/windows

      - name: Setup Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Export Windows Build
        run: godot --headless --export-release "Windows Desktop" build/windows/DeadlineSlayer.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/windows/DeadlineSlayer.exe"
          tag: "latest"
          name: "Latest Windows Build"
          body: "Automatically generated Windows build from the `main` branch."
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
