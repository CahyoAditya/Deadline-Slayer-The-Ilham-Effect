name: Godot CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  export_and_deploy:
    name: Export to Web and Deploy
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Create Web Build Folder
        run: mkdir -p build/web

      - name: Setup Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Export Web Build
        run: |
          godot --headless --export-release "Web" build/web/game.html

      - name: Copy Wrapper & Vercel Config
        run: |
          cp -r web_wrapper/* build/web/
          
      - name: Fix Git Dubious Ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
      - name: Zip Web Build
        run: |
          apt-get update && apt-get install -y zip
          cd build/web
          zip -r ../../DeadlineSlayer-Web.zip .

      - name: Publish Web Build to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "DeadlineSlayer-Web.zip"
          tag: "latest"
          name: "Latest Web Build"
          body: "Automatically generated builds from the `main` branch."
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node for Butler
        run: apt-get update && apt-get install -y nodejs npm

      - name: Publish Web Build to itch.io
        uses: manleydev/butler-publish-itchio-action@v1.0.3
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: html5
          ITCH_GAME: deadline-slayer-the-ilham-effect
          ITCH_USER: hamgarian
          PACKAGE: build/web

  export_windows:
    name: Export Windows Desktop
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Create Windows Build Folder
        run: mkdir -p build/windows

      - name: Setup Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Export Windows Build
        run: godot --headless --export-release "Windows Desktop" build/windows/DeadlineSlayer.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows

      - name: Publish to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/windows/DeadlineSlayer.exe"
          tag: "latest"
          name: "Latest Windows Build"
          body: "Automatically generated Windows build from the `main` branch."
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node for Butler
        run: apt-get update && apt-get install -y nodejs npm

      - name: Publish Windows Build to itch.io
        uses: manleydev/butler-publish-itchio-action@v1.0.3
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: windows
          ITCH_GAME: deadline-slayer-the-ilham-effect
          ITCH_USER: hamgarian
          PACKAGE: build/windows
