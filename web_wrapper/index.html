<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadline Slayer : The Ilham Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-container">
        <!-- The Bezel of the CRT Monitor -->
        <div class="bezel">
            <!-- Glass glare effect -->
            <div class="glare"></div>
            <!-- The actual game iframe -->
            <iframe id="game-iframe" src="game.html" frameborder="0" allowfullscreen></iframe>
            <!-- Scanlines and curvature overlay -->
            <div class="crt-overlay"></div>
        </div>
        <div class="monitor-controls">
            <span class="brand">GKV-TRON 2000</span>
            <div class="buttons">
                <div class="btn"></div>
                <div class="btn"></div>
                <div class="btn active"></div>
            </div>
        </div>
    </div>
</body>
</html>
